<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; margin: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h2>🛠️ Admin Dashboard</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Title</th><th>Description</th><th>Status</th><th>Assign Official</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    async function loadPotholes() {
      const res = await fetch('/api/potholes');
      const data = await res.json();
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      data.features.forEach(f => {
        const p = f.properties;
        tbody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.title}</td>
            <td>${p.description}</td>
            <td>${p.status}</td>
            <td>
              <input id="off_${p.id}" placeholder="Official name">
              <button onclick="assign(${p.id})">Assign</button>
            </td>
          </tr>`;
      });
    }

    async function assign(id) {
      const official = document.getElementById('off_' + id).value;
      if (!official) return alert('Enter official name');
      const res = await fetch('/api/assign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, official })
      });
      const out = await res.json();
      alert(out.status);
      loadPotholes();
    }

    loadPotholes();
  </script>
</body>
</html>
