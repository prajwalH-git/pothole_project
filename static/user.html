<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - Smart Pothole Reporter</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    header h1 {
      font-size: 20px;
      margin: 0;
    }

    header button {
      background: #1f2937;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: inset 2px 2px 4px #00000033, inset -2px -2px 4px #ffffff33;
      transition: all 0.2s ease;
    }

    header button:hover {
      background: #374151;
    }

    #map {
      flex: 1;
      width: 100%;
      height: 60vh;
      border-bottom: 2px solid #ccc;
    }

    #reportForm {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin: 10px;
    }

    #reportForm input, #reportForm select, #reportForm button {
      margin-top: 8px;
      display: block;
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    #reportForm button {
      background: #2563eb;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    #reportForm button:hover {
      background: #1d4ed8;
    }

    .scroll-container {
      background: #f9fafb;
      padding: 15px;
      overflow-y: auto;
      height: 40vh;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: scale(1.02);
      background: #f3f4f6;
    }

    .severity-high { border-left: 6px solid #dc2626; }
    .severity-medium { border-left: 6px solid #f59e0b; }
    .severity-low { border-left: 6px solid #10b981; }

    img.thumb {
      width: 100px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Smart Pothole Reporter</h1>
    <button onclick="getLocation()">📍 Use My Location</button>
  </header>

  <div id="map"></div>

  <section id="reportForm">
    <h3>Report a New Pothole</h3>
    <form id="formData" enctype="multipart/form-data">
      <input type="text" id="latitude" name="latitude" placeholder="Latitude" required>
      <input type="text" id="longitude" name="longitude" placeholder="Longitude" required>
      <select name="severity" required>
        <option value="">Select Severity</option>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
      </select>
      <input type="file" name="image" accept="image/*">
      <button type="submit">Submit Report</button>
    </form>
  </section>

  <div class="scroll-container" id="reportList">
    <h3>Reported Potholes (Sorted by Severity ↓)</h3>
    <div id="cards"></div>
  </div>

  <script>
    // Initialize map
    const map = L.map('map').setView([12.9716, 77.5946], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markers = [];

    async function loadPotholes() {
      const res = await fetch('/api/potholes_viewport?min_lat=12.8&max_lat=13.1&min_lon=77.4&max_lon=77.7');
      const data = await res.json();
      updateMap(data);
      updateCards(data);
    }

    function updateMap(data) {
      markers.forEach(m => map.removeLayer(m));
      data.forEach(p => {
        const marker = L.marker([p.latitude, p.longitude]).addTo(map);
        marker.bindPopup(`
          <b>Severity:</b> ${p.severity}<br>
          <b>Status:</b> ${p.status}<br>
          ${p.image_path ? `<img src='/${p.image_path}' class='thumb'>` : ''}
        `);
        markers.push(marker);
      });
    }

    function updateCards(data) {
      const severityOrder = { High: 3, Medium: 2, Low: 1 };
      data.sort((a, b) => severityOrder[b.severity] - severityOrder[a.severity]);
      const cardsDiv = document.getElementById('cards');
      cardsDiv.innerHTML = '';
      data.forEach(p => {
        const div = document.createElement('div');
        div.className = `card severity-${p.severity.toLowerCase()}`;
        div.innerHTML = `
          <b>Severity:</b> ${p.severity}<br>
          <b>Status:</b> ${p.status}<br>
          <b>Coordinates:</b> (${p.latitude.toFixed(3)}, ${p.longitude.toFixed(3)})<br>
          ${p.image_path ? `<img src='/${p.image_path}' class='thumb'>` : ''}
        `;
        cardsDiv.appendChild(div);
      });
    }

    // Get user location
    function getLocation() {
      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById('latitude').value = pos.coords.latitude;
        document.getElementById('longitude').value = pos.coords.longitude;
        map.setView([pos.coords.latitude, pos.coords.longitude], 15);
      });
    }

    // Submit new report
    document.getElementById('formData').onsubmit = async e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch('/api/report', { method: 'POST', body: formData });
      const msg = await res.json();
      alert(msg.message);
      loadPotholes();
    };
